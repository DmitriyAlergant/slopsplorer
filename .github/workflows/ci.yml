# Runs on every push to main and on every pull request, including pull requests
# from forks.
#
# It must therefore stay safe against a hostile pull request. Two rules keep it
# that way, and both have to hold for any change to this file:
#
#   1. The trigger is `pull_request`, never `pull_request_target`. A
#      `pull_request` run checks out the fork's code with a read-only token and
#      no access to repository secrets. `pull_request_target` would check out
#      the same untrusted code with a writable token and the full secret set.
#   2. This workflow needs no secrets, so there is nothing here for a hostile
#      pull request to steal even if it achieves code execution.
#
# `npm ci --ignore-scripts` stops a dependency added by a pull request from
# running arbitrary code during install. The build and test steps still run that
# pull request's code, which is the point of CI; the read-only token is what
# bounds the damage.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24"]
    name: node ${{ matrix.node }}
    steps:
      # Actions are pinned to a commit rather than to a tag. A tag can be moved
      # to point at different code; a commit cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
